version: "2"

linters:
  default: none
  enable:
    # bugs
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - nilerr
    - errorlint
    - exhaustive
    # security
    - gosec
    # quality
    - revive
    - unused
    - ineffassign
    - unconvert
    - contextcheck
    - noctx
    # modernize (autofix)
    - intrange
    - exptostd
    - modernize
    - usestdlibvars
    - perfsprint
    # additional quality
    - nilnil
    - nonamedreturns
    - sloglint
    - tagliatelle
    - gocritic
    # testing
    - testifylint
    - thelper
    # bugs/correctness
    - mirror
    - musttag
    - fatcontext
    - reassign
    # code quality
    - gochecknoinits
    - prealloc
    - dupword
    # an exception names its linter and says why
    - nolintlint
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      enable-all-rules: false
      rules:
        - name: import-alias-naming
          severity: error
          arguments:
            - "^[a-z][a-z0-9]*$"
    exhaustive:
      default-signifies-exhaustive: true
    perfsprint:
      err-error: true
      strconcat: false
    tagliatelle:
      case:
        rules:
          json: camel
          yaml: camel
          xml: camel
          env: upperSnake
    gocritic:
      enabled-checks:
        - filepathJoin
        - commentedOutCode
        - deferInLoop
        - docStub
        - paramTypeCombine
        - ptrToRefParam
        - stringXbytes
        - unnecessaryBlock
        - weakCond
  exclusions:
    rules:
      # The CLI reads the files and directories its user names on the command
      # line. That path is the input, not a traversal.
      - path: cmd/apikit/
        linters: [gosec]
        text: G703
      # A test runs the toolchain and reads the files it wrote itself.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - blank
        - prefix(github.com/kausys/apikit)
        - default

issues:
  # Report every finding at once, not the first three of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0
