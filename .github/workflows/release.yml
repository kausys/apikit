name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-cli:
    name: Release CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod names 1.27 with no patch: take the newest 1.27.x, not the
          # one the runner happens to have cached.
          check-latest: true

      - name: Create go.work
        run: go work init . cmd

      - name: Test
        run: |
          go test -race ./...
          (cd cmd && go test -race ./...)

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --config ${{ github.workspace }}/.golangci.yml
          version: v2.14.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

      - name: Lint cmd
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: cmd
          args: --config ${{ github.workspace }}/.golangci.yml
          version: v2.14.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

      # GoReleaser builds the binaries users download; they must be built from
      # cmd's go.mod, as `go install` builds them, not from the workspace.
      - name: Remove go.work
        run: rm -f go.work go.work.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-please also mirrors cmd/vX.Y.Z on release_created; keep this for
      # manual v* tags and make it idempotent so re-runs do not fail with
      # "tag already exists" (exit 128).
      - name: Create sub-module tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CMD_TAG="cmd/${TAG}"
          if git rev-parse "refs/tags/${CMD_TAG}" >/dev/null 2>&1; then
            echo "${CMD_TAG} already exists — skip"
            exit 0
          fi
          git tag "${CMD_TAG}"
          git push origin "${CMD_TAG}"
